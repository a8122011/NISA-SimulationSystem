<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    
    <head>
        <meta charset="UTF-8">
        <title>商品選択</title>
        <!-- CSS -->
        <link rel="stylesheet" th:href="@{/mainpage.css}">
        <!-- JS -->
        <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
        <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    </head>

    <body>
        <div th:fragment="productSelection_body">
            <div class="productSelection">
                <h2> つみたてNISA対象商品 </h2>
                
                <table>
                    <thead>
                        <tr>
                            <th class="fundnameWidth">ファンド名称</th>
                            <th class="returnWidth">期待収益率 <button type="button" id="expectedRateOfReturnButton"> ? </button></th>
                            <th class="volaWidth">ボラティリティ<button type="button" id="volatilityButton"> ? </button></th>
                            <th class="companyWidth">運用会社</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <input type="checkbox" id="mitsui_dc" name="productName" value="mitsui_dc"/>
                                <label for="mitsui_dc">三井住友・DCつみたてNISA・日本株インデックスファンド</label>
                                <button type="button" class="info-btn" data-key="mitsui_dc"> →</button>
                            </td>
                            <td>19.117%</td>
                            <td>8.677%</td>
                            <td> 三井住友DSアセットマネジメント株式会社</td>
                        </tr>
                        <tr>
                            <td>
                                <input type="checkbox" id="mitsubishi_emaxis" name="productName" value="mitsubishi_emaxis"/>
                                <label for="mitsubishi_emaxis">eMAIXISバランス(8資産均等型)</label>
                                <button type="button" class="info-btn" data-key="mitsubishi_emaxis"> →</button>
                            </td>
                            <td>9.564%</td>
                            <td>10.639%</td>
                            <td>三菱UFJアセットマネジメント株式会社</td>
                        </tr>
                        <tr>
                            <td>
                                <input type="checkbox" id="nomura_nomu" name="productName" value="nomura_nomu"/>
                                <label for="nomura_nomu">のむラップ・ファンド(積極型)</label>
                                <button type="button" class="info-btn" data-key="nomura_nomu"> →</button>
                            </td>
                            <td>10.852%</td>
                            <td>14.521%</td>
                            <td> 野村アセットマネジメント株式会社</td>
                        </tr>
                        <tr>
                            <td>
                                <input type="checkbox" id="mitsui_smtam" name="productName" value="mitsui_smtam"/>
                                <label for="mitsui_smtam">SMTAMダウ・ジョーンズ インデックスファンド</label>
                                <button type="button" class="info-btn" data-key="mitsui_smtam"> →</button>
                            </td>
                            <td>17.167%</td>
                            <td>20.659%</td>
                            <td> 三井住友トラストアセットマネジメント株式会社</td>
                        </tr>
                        <tr>
                            <td>
                                <input type="checkbox" id="amova_sp500" name="productName" value="amova_sp500"/>
                                <label for="amova_sp500">上場インデックスファンド米国株式(sp500)</label>
                                <button type="button" class="info-btn" data-key="amova_sp500"> →</button>
                            </td>
                            <td>18.553%</td>
                            <td>21.038%</td>
                            <td> アモーヴァ・アセットマネジメント株式会社</td>
                        </tr>
                        <tr>
                            <td>
                                <input type="checkbox" id="daiwa_iFree" name="productName" value="daiwa_iFree"/>
                                <label for="daiwa_iFree">iFreeETF JPX 日経400</label>
                                <button type="button" class="info-btn" data-key="daiwa_iFree"> →</button>
                            </td>
                            <td>11.003%</td>
                            <td>18.989%</td>
                            <td>大和アセットマネジメント株式会社</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 商品についてダイアログ -->
            <div id="fundInfoDialog" title="商品について" style="display:none;">
                <div id="fundDialogContent"></div>
            </div>
        </div>
    </body>

</html>
